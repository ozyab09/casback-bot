name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            front/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install front dependencies
        run: npm ci --prefix front

      - name: Build Mini App (Vite)
        run: npm --prefix front run build

      - name: Syntax-check tgcloud modules
        run: |
          for f in $(find tgcloud -name '*.js' -type f); do
            node --check "$f"
          done
